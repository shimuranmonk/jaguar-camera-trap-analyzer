name: Gate checks
on:
  pull_request:
  push:
    branches: ['feature/**', 'feat/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
