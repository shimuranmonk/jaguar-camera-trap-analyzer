[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jaguar-camera-trap-analyzer"
version = "0.1.0"
description = "JAGUAR camera trap data analyzer"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6==6.10.0"]

[project.scripts]
jaguar = "jaguar.app:main"

[tool.setuptools.packages.find]
include = ["jaguar*"]
